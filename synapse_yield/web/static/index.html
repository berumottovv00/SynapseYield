<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SynapseYield · 智能交易助手</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
    }

    /* ── 侧栏 ── */
    .sidebar {
      width: 280px;
      background: #1a1d2e;
      color: #c8ccd8;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 16px;
      flex-shrink: 0;
    }
    .sidebar h1 {
      font-size: 18px;
      color: #fff;
      font-weight: 700;
      letter-spacing: .5px;
      margin-bottom: 4px;
    }
    .sidebar p.sub { font-size: 12px; color: #6b7280; margin-bottom: 8px; }

    .field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: #6b7280;
      margin-bottom: 6px;
    }
    .field input, .field select {
      width: 100%;
      background: #252840;
      border: 1px solid #353857;
      border-radius: 8px;
      color: #e5e7eb;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: #6366f1; }

    .sidebar hr { border: none; border-top: 1px solid #2e3150; }

    .sidebar .hint {
      font-size: 11px;
      color: #4b5563;
      line-height: 1.6;
    }

    /* ── 聊天主区域 ── */
    .chat-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── 气泡 ── */
    .bubble {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }
    .bubble.system {
      align-self: flex-start;
      background: #fff;
      color: #374151;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .bubble.user {
      align-self: flex-end;
      background: #6366f1;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.thinking {
      align-self: flex-start;
      background: #f3f4f6;
      color: #6b7280;
      font-style: italic;
      font-size: 13px;
    }
    .bubble.error {
      align-self: flex-start;
      background: #fef2f2;
      color: #dc2626;
      border-left: 3px solid #dc2626;
    }
    .bubble.success {
      align-self: flex-start;
      background: #f0fdf4;
      color: #15803d;
      border-left: 3px solid #22c55e;
    }

    /* ── 选股卡片区 ── */
    .picks-container {
      align-self: flex-start;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .picks-header {
      font-size: 13px;
      color: #6b7280;
      padding: 0 2px;
    }

    .pick-card {
      background: #fff;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
      user-select: none;
    }
    .pick-card:hover { border-color: #a5b4fc; }
    .pick-card.selected {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }
    .pick-card.selected .pick-actions .btn-confirm { background: #6366f1; color: #fff; }

    .pick-card .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .symbol-badge {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
    }
    .action-tag {
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .action-tag.BUY { background: #dcfce7; color: #15803d; }
    .action-tag.SELL { background: #fef2f2; color: #dc2626; }

    .confidence-bar-wrap { flex: 1; }
    .confidence-label { font-size: 11px; color: #9ca3af; margin-bottom: 3px; }
    .confidence-bar {
      height: 5px;
      background: #f3f4f6;
      border-radius: 4px;
      overflow: hidden;
    }
    .confidence-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      border-radius: 4px;
      transition: width .3s;
    }

    .pick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pick-field { display: flex; flex-direction: column; gap: 2px; }
    .pick-field .pf-label { font-size: 10px; text-transform: uppercase; color: #9ca3af; letter-spacing: .5px; }
    .pick-field .pf-value { font-size: 13px; font-weight: 600; color: #374151; }
    .pf-value.tp { color: #16a34a; }
    .pf-value.sl { color: #dc2626; }
    .pf-input { width: 100%; font-size: 13px; font-weight: 600; color: #374151; border: 1px solid #d1d5db; border-radius: 4px; padding: 2px 6px; background: #f9fafb; outline: none; box-sizing: border-box; }
    .pf-input:focus { border-color: #6366f1; background: #fff; }
    .pf-input.tp { color: #16a34a; }
    .pf-input.sl { color: #dc2626; }

    .pick-rationale {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 10px;
      padding-top: 10px;
      border-top: 1px solid #f3f4f6;
    }

    .tags-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #f3f4f6;
      color: #4b5563;
    }
    .tag.risk { background: #fef9c3; color: #92400e; }

    .pick-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .btn { padding: 7px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: .15s; }
    .btn-confirm { background: #f3f4f6; color: #374151; }
    .btn-confirm:hover { background: #e5e7eb; }
    .btn-skip { background: transparent; color: #9ca3af; }
    .btn-skip:hover { color: #6b7280; }

    .submit-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0 2px;
    }
    .btn-submit {
      background: #6366f1;
      color: #fff;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .btn-submit:hover { background: #4f46e5; }
    .btn-submit:disabled { background: #c7d2fe; cursor: not-allowed; }
    .selected-count { font-size: 13px; color: #6b7280; }

    /* ── 下单结果卡片 ── */
    .result-card {
      background: #fff;
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      align-self: flex-start;
      max-width: 480px;
    }
    .result-card .rc-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 10px;
    }
    .rc-status { font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .rc-status.ok { background: #dcfce7; color: #15803d; }
    .rc-status.fail { background: #fef2f2; color: #dc2626; }
    .result-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b7280;
      padding: 3px 0;
      border-bottom: 1px solid #f9fafb;
    }
    .result-row span:last-child { color: #374151; font-weight: 500; }
    .bracket-row {
      margin-top: 8px;
      font-size: 11px;
      color: #9ca3af;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .bracket-row .br-item { display: flex; gap: 6px; }
    .br-label { padding: 1px 6px; border-radius: 6px; font-weight: 600; font-size: 10px; }
    .br-label.tp { background: #dcfce7; color: #15803d; }
    .br-label.sl { background: #fef2f2; color: #dc2626; }

    /* ── 输入栏 ── */
    .input-area {
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 16px 32px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-area textarea {
      flex: 1;
      resize: none;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #111827;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.5;
    }
    .input-area textarea:focus { border-color: #6366f1; }
    .btn-send {
      width: 44px; height: 44px;
      background: #6366f1;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-send:hover { background: #4f46e5; }
    .btn-send svg { fill: #fff; }

    /* 滚动条 */
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
  </style>
</head>
<body>

<!-- 侧栏 -->
<aside class="sidebar">
  <div>
    <h1>SynapseYield</h1>
    <p class="sub">智能量化交易助手</p>
  </div>

  <hr />

  <div class="field">
    <label>账户 ID</label>
    <input id="accountId" type="text" placeholder="acct_xxx" />
  </div>

  <div class="field">
    <label>审批人</label>
    <input id="reviewer" type="text" placeholder="shiyu" value="shiyu" />
  </div>

  <div class="field">
    <label>调研报告路径</label>
    <input id="reportPath" type="text" placeholder="/path/to/report.md" />
  </div>

  <div class="field">
    <label>选股数量</label>
    <select id="topN">
      <option value="1">1 支</option>
      <option value="2" selected>2 支</option>
      <option value="3">3 支</option>
      <option value="5">5 支</option>
    </select>
  </div>

  <div class="field">
    <label>拉取历史行情（可选，空格分隔）</label>
    <input id="symbols" type="text" placeholder="AAPL.US TSLA.US" />
  </div>

  <hr />

  <div class="hint">
    输入 <b>选股</b> 开始分析<br />
    选股后直接输入调整要求，Agent 将重新筛选<br />
    点击卡片选中，提交后由 Agent 自动下单
  </div>
</aside>

<!-- 聊天区域 -->
<div class="chat-wrapper">
  <div class="chat-header">
    <div class="dot"></div>
    策略 Agent 在线
  </div>

  <div class="messages" id="messages">
    <div class="bubble system">你好！请在左侧填写账户信息和报告路径，然后输入「选股」开始分析。</div>
  </div>

  <div class="input-area">
    <textarea id="userInput" rows="1" placeholder="输入消息，按 Enter 发送…"></textarea>
    <button class="btn-send" onclick="sendText()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
