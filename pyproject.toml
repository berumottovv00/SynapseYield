[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-yield"
version = "0.1.0"
description = "Harness-driven quant trading simulator with broker adapters."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "langgraph>=0.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pymysql>=1.1",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["synapse_yield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
